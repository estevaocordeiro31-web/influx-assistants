<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght=700;900&family=Inter:wght=400;600&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: #FFFFFF;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
      }
      .content-wrapper {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
      }
      .left-section {
        width: 60%;
        padding-top: 80px;
        padding-left: 100px;
        padding-right: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .right-section {
        width: 40%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .title {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 1.1;
        color: #0047AB;
        margin-bottom: 30px;
        letter-spacing: -2px;
      }
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 32px;
        line-height: 1.4;
        color: #1A1A1A;
      }
      .highlight {
        color: #FF5F1F;
        font-weight: 700;
      }
      .image-container {
        width: 100%;
        height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .image-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .decorative-line {
        position: absolute;
        bottom: 100px;
        left: 100px;
        width: 300px;
        height: 8px;
        background: #FFD700;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-wrapper">
            <div class="left-section">
                <h1 class="title">inFlux<br>Personal Tutor</h1>
                <p class="subtitle">Seu parceiro de inglês <span class="highlight">24/7</span>.<br>Aprenda no seu ritmo, do seu jeito.</p>
            </div>
            <div class="right-section">
                <div class="image-container">
                    <img src="/home/ubuntu/upload/search_images/CcSVgG1j1Qmj.jpg" alt="AI Tutor Learning">
                </div>
            </div>
        </div>
        <div class="decorative-line"></div>
    </div>
</body>
</html>
